[package]
name = "pdf_view_app"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[[bin]]
name = "pdf_view_app"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
pdf_core.workspace = true
pdf_viewer.workspace = true
typst_build.workspace = true
log.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
