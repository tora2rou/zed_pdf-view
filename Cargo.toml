[workspace]
resolver = "2"
members = ["crates/pdf_core", "crates/pdf_viewer", "crates/pdf_view_app", "crates/typst_build", "crates/build_diag", "crates/latex_build", "crates/epub_build"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
pdf_core = { path = "crates/pdf_core" }
pdf_viewer = { path = "crates/pdf_viewer" }
typst_build = { path = "crates/typst_build" }
build_diag = { path = "crates/build_diag" }
latex_build = { path = "crates/latex_build" }
epub_build = { path = "crates/epub_build" }
hayro = "0.8"
thiserror = "2"
memmap2 = "0.9"
log = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", rev = "fae8a354829e56bf5615fedfa8cdfecb124550c4" }
image = { version = "0.25", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fae8a354829e56bf5615fedfa8cdfecb124550c4", default-features = false, features = ["wayland", "x11"] }

# 開発ビルドでも依存crate(hayro等のラスタライザ)は最適化する。自分のcrateはデバッグしやすいまま。
[profile.dev.package."*"]
opt-level = 3
