name: Build Linux

# linux-packagingブランチのpush、手動実行、v*タグで動く。タグのときは、GitHub Releaseに.debを添付する。
on:
  push:
    branches: [linux-packaging]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    # .debの依存関係(libc6など)は、ビルドしたマシンのライブラリで決まる。Ubuntu 24.04向け。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config dpkg-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      # Rustは rust-toolchain.toml のバージョンが自動で入る。
      - uses: Swatinem/rust-cache@v2

      - name: Build the .deb
        run: packaging/debian/build-deb.sh dist

      - name: Show the package
        run: |
          dpkg-deb --info dist/chihayaburu_*.deb
          dpkg-deb --contents dist/chihayaburu_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: chihayaburu-deb
          path: dist/chihayaburu_*.deb

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/chihayaburu_*.deb
          fail_on_unmatched_files: true
