name: CI

on:
  push:
  pull_request:

# 同じブランチで新しいpushがあったら、実行中の古いものは止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GPUIのビルドに必要なもの。tesseractは、OCRの結合テストを実際に動かすために入れる。
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev libssl-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn

      # Rustは rust-toolchain.toml のバージョンが自動で入る。
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
