name: CI

on:
  push:
  pull_request:

# 同じブランチで新しいpushがあったら、実行中の古いものは止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GPUIのビルドに必要なもの。tesseractは、OCRの結合テストを実際に動かすために入れる。
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev libssl-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn

      # Rustは rust-toolchain.toml のバージョンが自動で入る。
      - uses: Swatinem/rust-cache@v2

      # ワークスペースにはZed全体が入っているので、Chihayaburu (と組み込み用のpdf_tab・typst_ui) のcrateだけを対象にする。
      - name: Format
        run: cargo fmt --check -p pdf_core -p pdf_viewer -p pdf_view_app -p typst_build -p pdf_tab -p typst_ui

      - name: Clippy
        run: cargo clippy --no-deps --all-targets --locked -p pdf_core -p pdf_viewer -p pdf_view_app -p typst_build -p pdf_tab -p typst_ui -- -D warnings

      # テスト用の機能(test-support)なしでも組めることを確かめる。テストだけ通っても、本体で使えない
      # 関数を呼んでいることがある。
      - name: Check without test features
        run: cargo check --locked -p pdf_tab -p typst_ui

      - name: Test
        run: cargo test --locked -p pdf_core -p pdf_viewer -p pdf_view_app -p typst_build -p pdf_tab -p typst_ui
